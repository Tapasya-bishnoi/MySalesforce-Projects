<template>

    <lightning-card title="Opportunity List">

        <div class="slds-m-around_medium">

            <lightning-button
                label="Show Open Opportunities"
                onclick={showOpen}>
            </lightning-button>

            <lightning-button
                label="Show Closed Won"
                onclick={showClosedWon}
                class="slds-m-left_small">
            </lightning-button>

        </div>

        <template if:true={opportunities}>

            <table class="slds-table slds-table_cell-buffer slds-table_bordered">

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Stage</th>
                        <th>Amount</th>
                    </tr>
                </thead>

                <tbody>

                    <template for:each={opportunities} for:item="opp">

                        <tr key={opp.Id}>
                            <td>{opp.Name}</td>
                            <td>{opp.StageName}</td>
                            <td>{opp.Amount}</td>
                        </tr>

                    </template>

                </tbody>

            </table>

        </template>

    </lightning-card>

</template>
